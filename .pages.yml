            type: string
            required: true
            options:
              maxlength: 120
          - name: personCompany
            label: Company
            type: string
            required: true
            options:
              maxlength: 120
      - name: resume
        label: Résumé section
        type: object
        required: true
        fields:
          - name: eyebrow
            label: Small section label
            type: string
            required: true
            options:
              maxlength: 80
          - name: heading
            label: Heading
            type: string
            required: true
            options:
              maxlength: 140
          - name: introduction
            label: Introduction
            type: text
            required: true
            options:
